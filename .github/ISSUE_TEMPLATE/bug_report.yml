name: Bug Report
description: Report a bug to help us improve
title: "[BUG] "
labels: ["type:bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: input
    id: app-version
    attributes:
      label: App Version
      description: "The version of HardwareVisualizer (e.g., v1.2.0). Found in Settings."
      placeholder: "v1.0.0"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Windows 11
        - Windows 10
        - macOS
        - Linux
    validations:
      required: true

  - type: input
    id: os-version
    attributes:
      label: OS Version
      placeholder: "e.g., 24H2, Sequoia 15.3, Ubuntu 24.04"
    validations:
      required: false

  - type: textarea
    id: hardware
    attributes:
      label: Hardware Configuration
      description: If the bug is related to hardware monitoring, please provide your PC specs.
      placeholder: |
        CPU: Intel Core i7-14700K
        GPU: NVIDIA RTX 4070
        Motherboard: ASUS ROG STRIX Z790-F
    validations:
      required: false

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots / Logs
      description: If applicable, add screenshots or error logs to help explain the problem.
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any other context about the problem.
    validations:
      required: false
