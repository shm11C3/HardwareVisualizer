name: "Cache sccache (R2)"
description: >-
  Compiler-level cache for rustc and, in jobs that build with
  `--features duckdb-archive`, the bundled DuckDB C++ build
  (libduckdb-sys), using sccache backed by a Cloudflare R2 bucket. Use
  after ./.github/actions/setup-rust in any job that compiles a meaningful
  amount of Rust (cargo build/test/check/clippy/run) - it is not worth
  adding to jobs that only run cargo fmt, cargo deny, or cargo install for
  a third-party binary, none of which invoke rustc on this workspace.

# Why sccache and not an `actions/cache` entry holding the crate's build-script
# `out/` directory (`target/debug/build/libduckdb-sys-*/out` plus the matching
# `.fingerprint` entry):
#
# Cargo has no early cutoff in its fingerprinting. A `run-build-script` unit is
# re-run whenever the `build-script-build` binary it depends on was rebuilt in
# the same invocation (`FsStatus::StaleDepFingerprint`), and that binary is
# rebuilt whenever any of its own dependencies (`cc`, `bindgen`, `syn`, `ureq`,
# ...) is rebuilt. Even when both are fresh, a `build-script-build` whose mtime
# is newer than the restored `output` file marks the unit stale
# (`StaleItem::ChangedFile`), which happens as soon as the two come from
# caches captured at different times. Restoring only the DuckDB `out/`
# therefore keeps it fresh only when the whole build-dependency closure is
# already fresh in `target/`, which is exactly the case where rust-cache keeps
# it anyway. sccache keys each `cl.exe` / `c++` invocation on preprocessed
# source, flags and compiler, so the DuckDB objects come from the cache even
# when Cargo decides to re-run the build script, and whether or not rust-cache
# had an entry.
#
# Backend history (see docs/development/local-build-cache.md for the full
# writeup and infra/cloudflare-r2-cache/ for the R2 bucket's Terraform):
#
# 1. SCCACHE_GHA_ENABLED=true (GitHub's Actions Cache Service, one live PUT
#    per compiled object): confirmed 0% hit rate, ~100% write errors under
#    this repository's concurrency, tracing to an unfixed upstream defect
#    (mozilla/sccache#2821) with no retry layer for that service's per-run
#    rate limit.
# 2. Local disk cache wrapped in a plain `actions/cache` step (one archive
#    upload per job): worked, but shares GitHub's ~10 GB per-repository
#    cache storage budget with rust-cache's `target/` entries, Node's
#    dependency cache, and everything else this repo caches. Once that
#    budget filled, saves failed with "Cache reservation failed" for
#    whichever job finished last in a run (consistently Windows, the
#    slowest platform), so a bug-free design still lost to resource
#    contention it doesn't control.
# 3. Current: sccache's native S3-compatible backend
#    (https://github.com/mozilla/sccache/blob/main/docs/S3.md), pointed at a
#    dedicated Cloudflare R2 bucket. This removes GitHub's Actions Cache
#    Service from the path entirely: no per-write rate limit, no shared
#    storage budget with unrelated caches, and R2 has zero egress fees for
#    the read-heavy pattern CI produces. The bucket has its own time-based
#    object expiry (see infra/cloudflare-r2-cache/main.tf) since R2 has no
#    built-in LRU eviction.
#
# The `cc` crate (1.2.67 in Cargo.lock) treats `RUSTC_WRAPPER=sccache` as a
# C/C++ compiler wrapper (`rustc_wrapper_fallback`), so no `CC`/`CXX` override
# is needed and the same variable also caches rustc output for dependency
# crates (workspace crates build incrementally and are passed through).
#
# Known miss: when a build-dependency of libduckdb-sys changes in Cargo.lock,
# the unit's metadata hash changes, DuckDB's sources are extracted under a new
# `OUT_DIR`, and that absolute path is part of the preprocessed output. The
# first run after such a bump recompiles DuckDB once and repopulates the
# cache.
#
# Credentials: account-id is a plain identifier (not a secret), passed as a
# repository variable at the call site. aws-access-key-id /
# aws-secret-access-key are R2's S3-compatible credentials, provisioned by
# infra/cloudflare-r2-cache/ (see that directory's README for setup and
# rotation) and passed as repository secrets. sccache reads these as
# plain AWS-style env vars; there is no R2-specific credential env var.
#
# Ordering: run this after setup-rust on purpose. rust-cache folds `RUST*`
# environment variables into its key, so exporting `RUSTC_WRAPPER` earlier
# would split the rust-cache key between jobs that use sccache and jobs that
# do not.

inputs:
  account-id:
    description: >-
      Cloudflare account ID that owns the R2 bucket. Callers pass the
      CLOUDFLARE_ACCOUNT_ID repository variable. Not a secret. (Do not
      write a live workflow expression in any description in this file:
      composite action manifests are template-evaluated at load time in a
      context with no vars/secrets, and one bad expression anywhere in the
      file fails the whole action's load, not just that field.)
    required: true
  aws-access-key-id:
    description: >-
      R2 Access Key ID. Callers pass the AWS_ACCESS_KEY_ID repository
      secret.
    required: true
  aws-secret-access-key:
    description: >-
      R2 Secret Access Key. Callers pass the AWS_SECRET_ACCESS_KEY
      repository secret.
    required: true

runs:
  using: "composite"
  steps:
    - name: Install sccache
      uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      with:
        version: "v0.17.0"

    - name: Point sccache at the R2 bucket
      shell: bash
      run: |
        echo "SCCACHE_BUCKET=hardwarevisualizer-sccache" >> "$GITHUB_ENV"
        echo "SCCACHE_ENDPOINT=https://${{ inputs.account-id }}.r2.cloudflarestorage.com" >> "$GITHUB_ENV"
        echo "SCCACHE_REGION=auto" >> "$GITHUB_ENV"
        echo "SCCACHE_S3_USE_SSL=true" >> "$GITHUB_ENV"
        echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
        echo "AWS_ACCESS_KEY_ID=${{ inputs.aws-access-key-id }}" >> "$GITHUB_ENV"
        echo "AWS_SECRET_ACCESS_KEY=${{ inputs.aws-secret-access-key }}" >> "$GITHUB_ENV"
