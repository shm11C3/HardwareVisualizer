name: Submit WinGet Manifest

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to submit, for example v1.7.0. Defaults to the latest release."
        required: false
        type: string
      installer-url:
        description: "Optional MSI URL override. Defaults to the release asset named HardwareVisualizer_{VERSION}_x64_en-US.msi."
        required: false
        type: string
      submit:
        description: "Submit a PR to microsoft/winget-pkgs. Disable for a dry run."
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: winget-${{ github.event.release.tag_name || inputs.tag || 'latest' }}
  cancel-in-progress: false

jobs:
  submit-winget:
    name: Submit WinGet manifest
    if: github.event_name != 'release' || github.event.release.prerelease == false
    runs-on: windows-latest
    env:
      PACKAGE_IDENTIFIER: shm11C3.HardwareVisualizer
      WINGET_CREATE_VERSION: v1.12.8.0
      WINGET_CREATE_SHA256: 8bd738851b524885410112678e3771b341c5c716de60fbbecb88ab0a363ed85d
    steps:
      - name: Checkout workflow scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: ./.github/actions/setup-node
        with:
          install-deps: "false"
          setup-safe-chain: "false"

      - name: Resolve release metadata
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_INSTALLER_URL: ${{ inputs['installer-url'] || '' }}
          INPUT_TAG: ${{ inputs.tag || '' }}
          RELEASE_TAG: ${{ github.event.release.tag_name || '' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $tag = $env:RELEASE_TAG
          if ([string]::IsNullOrWhiteSpace($tag)) {
            $tag = $env:INPUT_TAG
          }
          if ([string]::IsNullOrWhiteSpace($tag)) {
            $tag = gh release view --repo $env:GITHUB_REPOSITORY --json tagName --jq '.tagName'
          }
          if ([string]::IsNullOrWhiteSpace($tag)) {
            throw 'Could not resolve a release tag.'
          }

          # Older MIT releases must retain the license declared at their tag.
          $encodedTag = [System.Uri]::EscapeDataString($tag)
          $packageContent = gh api "repos/$env:GITHUB_REPOSITORY/contents/package.json?ref=$encodedTag" --jq '.content'
          if ($LASTEXITCODE -ne 0) {
            throw "Could not read package.json at '$tag'."
          }
          $packageJson = [System.Text.Encoding]::UTF8.GetString([Convert]::FromBase64String(($packageContent -join ''))) | ConvertFrom-Json
          if ([string]::IsNullOrWhiteSpace($packageJson.license)) {
            throw "package.json at '$tag' does not declare a license."
          }
          "license=$($packageJson.license)" >> $env:GITHUB_OUTPUT
          "license-url=https://github.com/$env:GITHUB_REPOSITORY/blob/$encodedTag/LICENSE" >> $env:GITHUB_OUTPUT

          $version = $tag -replace '^v', ''
          $installerUrl = $env:INPUT_INSTALLER_URL
          if (-not [string]::IsNullOrWhiteSpace($installerUrl)) {
            if ($installerUrl -notmatch '^https://') {
              throw 'inputs.installer-url must be an https:// URL to an .msi installer.'
            }
            if ($installerUrl -notmatch '\.msi($|[?#])') {
              throw 'inputs.installer-url must be an https:// URL to an .msi installer.'
            }
          }
          if ([string]::IsNullOrWhiteSpace($installerUrl)) {
            $assetName = "HardwareVisualizer_${version}_x64_en-US.msi"
            $release = gh release view $tag --repo $env:GITHUB_REPOSITORY --json assets | ConvertFrom-Json
            $asset = $release.assets | Where-Object { $_.name -eq $assetName } | Select-Object -First 1
            if ($null -eq $asset) {
              throw "Release asset '$assetName' was not found on '$tag'."
            }
            $encodedTag = [System.Uri]::EscapeDataString($tag)
            $encodedAssetName = [System.Uri]::EscapeDataString($assetName)
            $installerUrl = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$encodedTag/$encodedAssetName"
          }

          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "installer-url=$installerUrl" >> $env:GITHUB_OUTPUT

      - name: Install .NET 6 runtime
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 6.0.x

      - name: Download and verify winget-create
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $downloadUrl = "https://github.com/microsoft/winget-create/releases/download/$env:WINGET_CREATE_VERSION/wingetcreate.exe"
          Invoke-WebRequest $downloadUrl -OutFile wingetcreate.exe

          $actualHash = (Get-FileHash wingetcreate.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $env:WINGET_CREATE_SHA256) {
            throw "wingetcreate.exe SHA256 mismatch. Expected $env:WINGET_CREATE_SHA256, got $actualHash."
          }

      - name: Generate, correct and submit WinGet manifest
        env:
          INSTALLER_URL: ${{ steps.release.outputs.installer-url }}
          VERSION: ${{ steps.release.outputs.version }}
          PACKAGE_LICENSE: ${{ steps.release.outputs.license }}
          LICENSE_URL: ${{ steps.release.outputs.license-url }}
          SHOULD_SUBMIT: ${{ inputs.submit || github.event_name == 'release' }}
          GH_TOKEN: ${{ secrets.WINGET_CREATE_GITHUB_TOKEN }}
          WINGET_CREATE_TOKEN: ${{ secrets.WINGET_CREATE_GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $shouldSubmit = $env:SHOULD_SUBMIT -eq 'true'
          $args = @(
            'update',
            $env:PACKAGE_IDENTIFIER,
            '-u', $env:INSTALLER_URL,
            '-v', $env:VERSION,
            '-o', 'manifests'
          )

          # update inherits locale metadata, including the previous license.
          .\wingetcreate.exe @args
          if ($LASTEXITCODE -ne 0) {
            throw 'WinGet manifest generation failed.'
          }
          $manifestDirectory = node .github/scripts/update-winget-license.mjs manifests $env:PACKAGE_LICENSE $env:LICENSE_URL
          if ($LASTEXITCODE -ne 0) {
            throw 'WinGet manifest license correction failed.'
          }

          if ($shouldSubmit) {
            if ([string]::IsNullOrWhiteSpace($env:WINGET_CREATE_TOKEN)) {
              throw 'WINGET_CREATE_GITHUB_TOKEN repository secret is required when submit is enabled.'
            }
            gh repo sync "$env:GITHUB_REPOSITORY_OWNER/winget-pkgs" --source microsoft/winget-pkgs --branch master
            if ($LASTEXITCODE -ne 0) {
              throw 'Failed to sync the winget-pkgs fork. Ensure WINGET_CREATE_GITHUB_TOKEN has the public_repo and workflow scopes, or sync the fork manually before retrying.'
            }
            .\wingetcreate.exe submit $manifestDirectory -t $env:WINGET_CREATE_TOKEN --no-open
            if ($LASTEXITCODE -ne 0) {
              throw 'WinGet manifest submission failed.'
            }
          }

      - name: Upload generated manifests
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: winget-${{ steps.release.outputs.version }}
          path: manifests/
