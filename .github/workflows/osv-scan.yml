name: OSV dependency scan

on:
  workflow_dispatch:
  schedule:
    # Daily 09:00 JST (00:00 UTC)
    - cron: "0 0 * * *"

permissions:
  actions: read
  contents: read

concurrency:
  group: osv-dependency-scan
  cancel-in-progress: true

jobs:
  scan-default-branch:
    name: Scan default branch
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@c51854704019a247608d928f370c98740469d4b5 # v2.3.5
    permissions:
      actions: read
      contents: read
      security-events: write
    with:
      ref: ${{ github.event.repository.default_branch }}
      scan-args: |-
        -r ./
      matrix-property: default-branch-
      results-file-name: osv-results.sarif
      upload-sarif: true
      fail-on-vuln: false

  resolve-latest-release:
    name: Resolve latest release
    runs-on: ubuntu-slim
    permissions:
      contents: read
    outputs:
      latest-tag: ${{ steps.release.outputs.latest_tag }}
    steps:
      - name: Resolve latest release tag
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          latest_tag=""
          if latest_tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq ".tag_name" 2>/dev/null)"; then
            if [ -n "$latest_tag" ]; then
              echo "Latest release tag: $latest_tag"
            else
              echo "Latest release endpoint returned an empty tag."
            fi
          else
            echo "No latest release found. Skipping latest release OSV scan."
          fi

          echo "latest_tag=$latest_tag" >> "$GITHUB_OUTPUT"

  upload-default-branch-osv-config:
    name: Upload default branch OSV config
    runs-on: ubuntu-slim
    permissions:
      contents: read
    steps:
      - name: Checkout default branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}

      - name: Upload OSV config
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: default-branch-osv-config
          path: osv-scanner.toml
          if-no-files-found: error
          retention-days: 1

  scan-latest-release:
    name: Scan latest release
    needs:
      - resolve-latest-release
      - upload-default-branch-osv-config
    if: needs.resolve-latest-release.outputs.latest-tag != ''
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@c51854704019a247608d928f370c98740469d4b5 # v2.3.5
    permissions:
      actions: read
      contents: read
      security-events: write
    with:
      ref: ${{ needs.resolve-latest-release.outputs.latest-tag }}
      download-artifact: default-branch-osv-config
      scan-args: |-
        -r ./
      matrix-property: latest-release-
      results-file-name: osv-results.sarif
      upload-sarif: true
      fail-on-vuln: false
