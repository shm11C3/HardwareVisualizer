name: OSV dependency scan

on:
  workflow_dispatch:
  schedule:
    # Daily 09:00 JST (00:00 UTC)
    - cron: "0 0 * * *"

permissions:
  actions: read
  contents: read

concurrency:
  group: osv-dependency-scan
  cancel-in-progress: true

jobs:
  scan-default-branch:
    name: Scan default branch
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@c51854704019a247608d928f370c98740469d4b5 # v2.3.5
    permissions:
      actions: read
      contents: read
      security-events: write
    with:
      ref: ${{ github.event.repository.default_branch }}
      scan-args: |-
        -r ./
      matrix-property: default-branch-
      results-file-name: osv-results.sarif
      upload-sarif: true
      fail-on-vuln: false

  resolve-latest-release:
    name: Resolve latest release
    runs-on: ubuntu-slim
    permissions:
      contents: read
    outputs:
      latest_tag: ${{ steps.release.outputs.latest_tag }}
      latest_sha: ${{ steps.release.outputs.latest_sha }}
    steps:
      - name: Resolve latest release tag
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          latest_tag=""
          if latest_tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq ".tag_name" 2>/dev/null)"; then
            if [ -n "$latest_tag" ]; then
              echo "Latest release tag: $latest_tag"
            else
              echo "Latest release endpoint returned an empty tag."
            fi
          else
            echo "No latest release found. Skipping latest release OSV scan."
          fi

          echo "latest_tag=$latest_tag" >> "$GITHUB_OUTPUT"

          latest_sha=""
          if [ -n "$latest_tag" ]; then
            tag_type="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${latest_tag}" --jq ".object.type")"
            tag_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${latest_tag}" --jq ".object.sha")"

            if [ "$tag_type" = "tag" ]; then
              latest_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_sha}" --jq ".object.sha")"
            else
              latest_sha="$tag_sha"
            fi

            if [ -z "$latest_sha" ] || [ "$latest_sha" = "null" ]; then
              echo "Failed to resolve commit SHA for release tag: $latest_tag" >&2
              exit 1
            fi

            echo "Latest release commit SHA: $latest_sha"
          fi

          echo "latest_sha=$latest_sha" >> "$GITHUB_OUTPUT"

  upload-default-branch-osv-config:
    name: Upload default branch OSV config
    runs-on: ubuntu-slim
    permissions:
      contents: read
    steps:
      - name: Checkout default branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}

      - name: Upload OSV config
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: default-branch-osv-config
          path: osv-scanner.toml
          if-no-files-found: error
          retention-days: 1

  scan-latest-release:
    name: Scan latest release
    needs:
      - resolve-latest-release
      - upload-default-branch-osv-config
    if: needs.resolve-latest-release.outputs.latest_tag != '' && needs.resolve-latest-release.outputs.latest_sha != ''
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout latest release
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
          ref: ${{ needs.resolve-latest-release.outputs.latest_tag }}

      - name: Download default branch OSV config
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: default-branch-osv-config
          path: ./

      - name: Run OSV scanner
        uses: google/osv-scanner-action/osv-scanner-action@7222d1c7ee4f96d71d883e0d3c603f1e1705eca9 # v2.3.5
        continue-on-error: true
        with:
          scan-args: |-
            --output=latest-release-results.json
            --format=json
            -r ./

      - name: Generate OSV SARIF report
        id: osv-reporter
        uses: google/osv-scanner-action/osv-reporter-action@7222d1c7ee4f96d71d883e0d3c603f1e1705eca9 # v2.3.5
        continue-on-error: true
        with:
          scan-args: |-
            --output=latest-release-osv-results.sarif
            --new=latest-release-results.json
            --gh-annotations=false
            --fail-on-vuln=true

      - name: Upload latest release OSV SARIF artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: latest-release-OSV Scanner SARIF file
          path: latest-release-osv-results.sarif
          if-no-files-found: error
          retention-days: 5

      - name: Upload latest release OSV SARIF to Code Scanning
        if: ${{ !cancelled() }}
        uses: github/codeql-action/upload-sarif@95e58e9a2cdfd71adc6e0353d5c52f41a045d225 # v4.35.2
        with:
          sarif_file: latest-release-osv-results.sarif
          category: osv-latest-release
          ref: refs/tags/${{ needs.resolve-latest-release.outputs.latest_tag }}
          sha: ${{ needs.resolve-latest-release.outputs.latest_sha }}

      - name: Fail on latest release vulnerabilities
        if: steps.osv-reporter.outcome == 'failure'
        run: exit 1
