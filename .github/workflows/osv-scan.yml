name: OSV dependency scan

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to scan. Defaults to the latest release."
        required: false
        type: string
  schedule:
    # Daily 09:00 JST (00:00 UTC)
    - cron: "0 0 * * *"

permissions:
  actions: read
  contents: read

concurrency:
  group: osv-dependency-scan
  cancel-in-progress: true

jobs:
  scan-default-branch:
    name: Scan default branch
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
    permissions:
      actions: read
      contents: read
      security-events: write
    with:
      ref: ${{ github.event.repository.default_branch }}
      scan-args: |-
        -r ./
      matrix-property: default-branch-
      results-file-name: osv-results.sarif
      upload-sarif: true
      fail-on-vuln: false

  resolve-release-tag:
    name: Resolve release tag
    runs-on: ubuntu-slim
    permissions:
      contents: read
    outputs:
      release-tag: ${{ steps.release.outputs.release_tag }}
    steps:
      - name: Resolve release tag
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_RELEASE_TAG: ${{ inputs.release_tag || '' }}
        shell: bash
        run: |
          set -euo pipefail

          release_tag="${REQUESTED_RELEASE_TAG}"
          if [ -n "$release_tag" ]; then
            echo "Requested release tag: $release_tag"
          elif release_tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq ".tag_name" 2>/dev/null)"; then
            if [ -n "$release_tag" ]; then
              echo "Latest release tag: $release_tag"
            else
              echo "Latest release endpoint returned an empty tag."
            fi
          else
            echo "No release tag found. Skipping release OSV scan."
          fi

          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"

  upload-default-branch-osv-assets:
    name: Upload default branch OSV assets
    runs-on: ubuntu-slim
    permissions:
      contents: read
    steps:
      - name: Checkout default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}

      - name: Upload OSV scan assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: default-branch-osv-scan-assets
          path: |
            osv-scanner.toml
            .github/osv/release-vulnerability-assessments.json
            .github/scripts/evaluate-release-vulnerabilities.mjs
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

  scan-release-tag:
    name: Scan release tag
    needs:
      - resolve-release-tag
      - upload-default-branch-osv-assets
    if: needs.resolve-release-tag.outputs.release-tag != ''
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.resolve-release-tag.outputs.release-tag }}

      - name: Download default branch OSV scan assets
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: default-branch-osv-scan-assets
          path: ./

      - name: Run OSV scanner
        uses: google/osv-scanner-action/osv-scanner-action@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
        continue-on-error: true
        with:
          scan-args: |-
            --output=release-results.json
            --format=json
            -r ./

      - name: Generate OSV SARIF report
        id: osv-reporter
        uses: google/osv-scanner-action/osv-reporter-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: |-
            --output=release-osv-results.sarif
            --new=release-results.json
            --gh-annotations=false
            --fail-on-vuln=false

      - name: Download CISA KEV catalog
        shell: bash
        run: |
          source_url="https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json"
          curl \
            --fail \
            --location \
            --connect-timeout 10 \
            --max-time 60 \
            --remove-on-error \
            --retry 3 \
            --retry-all-errors \
            --proto '=https' \
            --tlsv1.2 \
            --output cisa-kev.json \
            "$source_url"

          jq -n \
            --arg source_url "$source_url" \
            --arg retrieved_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg sha256 "$(sha256sum cisa-kev.json | awk '{print $1}')" \
            '{source_url: $source_url, retrieved_at: $retrieved_at, sha256: $sha256}' \
            > cisa-kev-metadata.json

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: "24"

      - name: Evaluate release vulnerability response
        run: |
          node .github/scripts/evaluate-release-vulnerabilities.mjs \
            release-results.json \
            .github/osv/release-vulnerability-assessments.json \
            cisa-kev.json \
            release-vulnerability-evaluation.json
        env:
          OSV_RELEASE_TAG: ${{ needs.resolve-release-tag.outputs.release-tag }}

      - name: Upload release OSV evaluation artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-osv-evaluation
          path: |
            cisa-kev.json
            cisa-kev-metadata.json
            release-results.json
            release-osv-results.sarif
            release-vulnerability-evaluation.json
          if-no-files-found: warn
          retention-days: 30
