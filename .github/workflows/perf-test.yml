name: "Performance Test"

on:
  schedule:
    - cron: "0 18 * * *" # Daily at 03:00 JST (18:00 UTC)
  workflow_dispatch:

permissions: read-all

jobs:
  perf-test:
    strategy:
      fail-fast: false
      matrix:
        platform:
          - windows-latest

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup Linux dependencies
        if: runner.os == 'Linux'
        uses: ./.github/actions/setup-linux-deps
        with:
          extra-packages: xvfb

      - name: Setup Node.js
        uses: ./.github/actions/setup-node

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          components: ""

      - name: Cache perf-monitor target
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: perf-monitor/target
          key: perf-monitor-${{ runner.os }}-${{ hashFiles('perf-monitor/Cargo.toml') }}
          restore-keys: |
            perf-monitor-${{ runner.os }}-

      - name: Build perf-monitor
        run: cargo build --release --manifest-path perf-monitor/Cargo.toml

      - name: Build Tauri app (macOS)
        if: runner.os == 'macOS'
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --bundles app -- --profile ci

      - name: Build Tauri app
        if: runner.os != 'macOS'
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --no-bundle -- --profile ci

      - name: Run performance test (Linux)
        if: runner.os == 'Linux'
        run: |
          xvfb-run --auto-servernum \
            ./perf-monitor/target/release/perf-monitor \
              --binary target/ci/hardware-visualizer \
              --config perf-thresholds.toml \
              --output json \
            > perf-results.json

      - name: Run performance test (macOS)
        if: runner.os == 'macOS'
        run: |
          ./perf-monitor/target/release/perf-monitor \
            --binary "target/ci/bundle/macos/HardwareVisualizer.app/Contents/MacOS/hardware-visualizer" \
            --config perf-thresholds.toml \
            --output json \
          > perf-results.json

      - name: Run performance test (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          ./perf-monitor/target/release/perf-monitor.exe \
            --binary target/ci/hardware-visualizer.exe \
            --config perf-thresholds.toml \
            --output json \
          > perf-results.json

      - name: Run WebView2 memory growth test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: npm run test:perf:webview-memory -- --Binary target/ci/hardware-visualizer.exe --OutputDirectory webview-memory-results --WarmupSeconds 60 --DurationSeconds 600 --SampleIntervalSeconds 5 --TailWindowSeconds 180

      - name: Show results
        if: always()
        shell: bash
        run: cat perf-results.json 2>/dev/null || echo "No results file"

      - name: Show WebView2 memory results
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Test-Path webview-memory-results/webview-memory-results.json) {
            Get-Content webview-memory-results/webview-memory-results.json -Raw
          } else {
            Write-Host "No WebView2 memory results file"
          }

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: perf-results-${{ matrix.platform }}
          path: |
            perf-results.json
            webview-memory-results/

  notify:
    needs: perf-test
    if: failure()
    runs-on: ubuntu-slim
    permissions:
      issues: write
    steps:
      - name: Create or update issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const label = 'performance-regression';
            const title = 'Performance test threshold exceeded';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            // Ensure label exists
            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: label,
              });
            } catch {
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: label,
                color: 'e11d48',
                description: 'Automated performance test detected a threshold violation',
              });
            }

            // Check for existing open issue
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: label,
              state: 'open',
              per_page: 1,
            });

            const body = `Performance test failed on ${new Date().toISOString().split('T')[0]}.\n\n` +
              `**Workflow run:** ${runUrl}\n\n` +
              `Download the \`perf-results-*\` artifacts from the workflow run for details.`;

            if (issues.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: [label],
              });
            }
