name: auto-merge

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions: read-all

jobs:
  auto-merge:
    name: Approve and enable auto-merge
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    if: >
      github.repository == 'shm11C3/HardwareVisualizer' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false &&
      (
        github.event.pull_request.user.login == 'hardwarevisualizerappmanager[bot]' ||
        github.event.pull_request.user.login == 'dependabot[bot]'
      )

    steps:
      - name: Fetch Dependabot metadata
        if: github.event.pull_request.user.login == 'dependabot[bot]'
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98
        with:
          github-token: ${{ github.token }}

      - name: Check approval eligibility
        id: approval
        shell: bash
        run: |
          if [[ "${PR_AUTHOR}" == "dependabot[bot]" && "${DEPENDABOT_UPDATE_TYPE}" =~ ^version-update:semver-(patch|minor)$ ]]; then
            echo "approved=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "approved=false" >> "$GITHUB_OUTPUT"
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          DEPENDABOT_UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}

      - name: Generate GitHub App token
        id: generate-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      # Temporary workaround: PRs created by hardwarevisualizerappmanager[bot] cannot be
      # approved by the same GitHub App, so request a human review until a separate
      # approver App is introduced.
      - name: Request appmanager PR review
        if: github.event.pull_request.user.login == 'hardwarevisualizerappmanager[bot]'
        run: gh pr edit "$PR_URL" --add-reviewer shm11C3
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}

      - name: Assign manual follow-up
        if: steps.approval.outputs.approved != 'true'
        run: gh pr edit "$PR_URL" --add-assignee shm11C3
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}

      - name: Approve PR
        if: steps.approval.outputs.approved == 'true'
        run: gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}

      - name: Enable auto-merge
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
