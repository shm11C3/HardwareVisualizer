name: "DuckDB CI Fanout PoC"

on:
  pull_request:
  workflow_dispatch:

permissions: read-all

# Keep the control revision fixed while this Draft PR is measured. The head
# job runs the same Windows image, Rust setup, feature set, and nextest
# version, so its archive-build and test timings are comparable to baseline.
env:
  BASELINE_SHA: b0cda32c0f4eaf32bc7559557df4d9c6976405a8
  HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  baseline:
    name: Baseline (pinned develop)
    runs-on: windows-latest
    steps:
      - name: Checkout baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BASELINE_SHA }}
          fetch-depth: 1

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          components: ""
          cache-key: core-test

      - name: Cache DuckDB build
        uses: ./.github/actions/cache-sccache
        with:
          bucket-name: ${{ vars.CLOUDFLARE_R2_BUCKET }}
          endpoint: ${{ vars.CLOUDFLARE_R2_ENDPOINT }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Install cargo-nextest
        uses: taiki-e/install-action@d438492cf8a250514fa2d34b30bc3c0dc37c65ff # v2.87.8
        with:
          tool: cargo-nextest@0.9.143

      - name: Build baseline archive
        run: cargo nextest archive -p hardviz-core --features duckdb-archive --profile ci --archive-file baseline.tar.zst

      - name: Capture baseline compiler cache stats
        run: sccache --show-stats

      - name: Capture baseline test inventory
        run: cargo nextest list -p hardviz-core --features duckdb-archive --message-format json > baseline-nextest.json

      - name: Run baseline unsharded
        run: cargo nextest run --archive-file baseline.tar.zst --workspace-remap . --extract-to . --extract-overwrite --profile ci

      - name: Upload baseline inventory and JUnit
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: duckdb-poc-baseline
          path: |
            baseline-nextest.json
            target/nextest/ci/junit.xml
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  head:
    name: Head (consolidated, unsharded)
    runs-on: windows-latest
    steps:
      - name: Checkout head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 1

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          components: ""
          cache-key: core-test

      - name: Cache DuckDB build
        uses: ./.github/actions/cache-sccache
        with:
          bucket-name: ${{ vars.CLOUDFLARE_R2_BUCKET }}
          endpoint: ${{ vars.CLOUDFLARE_R2_ENDPOINT }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Install cargo-nextest
        uses: taiki-e/install-action@d438492cf8a250514fa2d34b30bc3c0dc37c65ff # v2.87.8
        with:
          tool: cargo-nextest@0.9.143

      - name: Build head archive
        run: cargo nextest archive -p hardviz-core --features duckdb-archive --profile ci --archive-file head.tar.zst

      - name: Capture head compiler cache stats
        run: sccache --show-stats

      - name: Capture head test inventory
        run: cargo nextest list -p hardviz-core --features duckdb-archive --message-format json > head-nextest.json

      - name: Run head unsharded
        run: cargo nextest run --archive-file head.tar.zst --workspace-remap . --extract-to . --extract-overwrite --profile ci

      - name: Upload head inventory and JUnit
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: duckdb-poc-head
          path: |
            head-nextest.json
            target/nextest/ci/junit.xml
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  compare:
    name: Compare inventories
    needs:
      - baseline
      - head
    runs-on: ubuntu-slim
    steps:
      - name: Checkout head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 1

      - name: Download baseline artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: duckdb-poc-baseline
          path: baseline

      - name: Download head artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: duckdb-poc-head
          path: head

      - name: Compare unique test inventory
        run: node .github/scripts/compare-nextest-inventory.mjs --baseline baseline/baseline-nextest.json --head head/head-nextest.json
