name: PR Branch Name

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions: read-all

jobs:
  validate:
    runs-on: ubuntu-slim

    steps:
      # Warns only: release-note labels come from the PR title (see
      # pr-labeler.yml), so a branch prefix is a convention, not a gate.
      - name: Validate PR branch name
        shell: bash
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          case "$HEAD_REF" in
            feat/*|feature/*|fix/*|docs/*|perf/*|refactor/*|chore/*|dependabot/*|renovate/*)
              echo "Branch name '$HEAD_REF' follows the project convention."
              ;;
            *)
              echo "::warning title=Unconventional PR branch name::Branch '$HEAD_REF' does not use a recommended prefix (feat/, feature/, fix/, docs/, perf/, refactor/, chore/, dependabot/, renovate/). Branch prefixes are a convention only; release-note labels come from the PR title. Do not use tool-dependent prefixes such as codex/ or claude/."
              ;;
          esac
