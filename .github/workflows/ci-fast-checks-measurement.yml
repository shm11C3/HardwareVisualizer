name: CI fast checks measurement

# Temporary, PR-scoped evidence for the fast-checks PoC. Keep this workflow
# conventional so the repository's pinned actionlint can validate it; the main
# CI workflow still owns the repository's step-level overlap controls.
on:
  pull_request:
    branches:
      - develop
    paths:
      - .github/workflows/ci-fast-checks-measurement.yml

permissions:
  contents: read

env:
  # Keep both variants on the same pinned base while the PoC is measured.
  BASE_SHA: b0cda32c0f4eaf32bc7559557df4d9c6976405a8
  HEAD_SHA: ${{ github.event.pull_request.head.sha }}

jobs:
  baseline-rust-format:
    name: Baseline rust-format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BASE_SHA }}

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          components: rustfmt
          cache-key: format
          cache-targets: "false"

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

  head-rust-format:
    name: Head rust-format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.HEAD_SHA }}

      - name: Read pinned Rust toolchain
        id: rust-toolchain
        shell: bash
        run: |
          toolchain="$(sed -nE 's/^channel[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' rust-toolchain.toml | head -n 1)"
          test -n "$toolchain"
          echo "toolchain=$toolchain" >> "$GITHUB_OUTPUT"

      - name: Setup rustfmt
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.toolchain }}
          components: rustfmt

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

  baseline-frontend-check:
    name: Baseline check-frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BASE_SHA }}

      - name: Setup Node.js
        uses: ./.github/actions/setup-node

      # The old check-frontend job started lint and coverage tests together.
      # Keep the overlap in one ordinary shell step so this benchmark remains
      # valid under actionlint 1.7.11.
      - name: Frontend lint and tests
        shell: bash
        run: |
          set -uo pipefail
          /usr/bin/time -p -o lint.time npm run lint:ci >lint.log 2>&1 &
          lint_pid=$!
          /usr/bin/time -p -o test.time npm test >test.log 2>&1 &
          test_pid=$!
          lint_status=0
          test_status=0
          wait "$lint_pid" || lint_status=$?
          wait "$test_pid" || test_status=$?
          cat lint.log test.log lint.time test.time
          if (( lint_status != 0 )); then
            exit "$lint_status"
          fi
          exit "$test_status"

  baseline-frontend-build:
    name: Baseline build-frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BASE_SHA }}

      - name: Setup Node.js
        uses: ./.github/actions/setup-node

      - name: Run frontend build
        run: /usr/bin/time -p npm run build

  head-frontend-lint:
    name: Head lint-frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.HEAD_SHA }}

      - name: Setup Node.js
        uses: ./.github/actions/setup-node

      - name: Frontend lint
        run: /usr/bin/time -p npm run lint:ci

  head-frontend-check:
    name: Head check-frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.HEAD_SHA }}

      - name: Setup Node.js
        uses: ./.github/actions/setup-node

      # The new check-frontend job runs tests while the build uses the same
      # installed dependencies. Keep both processes in one conventional step.
      - name: Frontend tests and build
        shell: bash
        run: |
          set -uo pipefail
          /usr/bin/time -p -o test.time npm test >test.log 2>&1 &
          test_pid=$!
          build_status=0
          /usr/bin/time -p -o build.time npm run build >build.log 2>&1 || build_status=$?
          test_status=0
          wait "$test_pid" || test_status=$?
          cat build.log test.log build.time test.time
          if (( build_status != 0 )); then
            exit "$build_status"
          fi
          exit "$test_status"
