name: Rust test runner measurement

# Temporary, PR-scoped evidence for moving the App crate's tests from
# `cargo test -- --test-threads=1` to cargo-nextest. Both runners execute in
# the same job against the same test binaries, alternating order, because
# runners with the same label differ in speed by up to four times. Delete this
# workflow once the decision is recorded.
on:
  pull_request:
    branches:
      - develop
    paths:
      - .github/workflows/rust-test-runner-measurement.yml

permissions:
  contents: read

env:
  R2_CACHE_ALLOWED: ${{ github.event.pull_request.head.repo.full_name == github.repository }}

jobs:
  measure-app-tests:
    name: Measure App tests (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        platform: ["windows-latest", "ubuntu-22.04", "macos-latest"]
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Setup Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        uses: $/.github/actions/setup-linux-deps

      - name: Setup Rust
        uses: $/.github/actions/setup-rust
        with:
          components: ""
          cache-key: tauri-test

      - name: Cache sccache (R2)
        if: env.R2_CACHE_ALLOWED == 'true'
        uses: $/.github/actions/cache-sccache
        with:
          expect-cpp: "true"
          bucket-name: ${{ vars.CLOUDFLARE_R2_BUCKET }}
          endpoint: ${{ vars.CLOUDFLARE_R2_ENDPOINT }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2.90.5
        with:
          tool: cargo-nextest

      # Build once so neither measured run pays for compilation. nextest reuses
      # the binaries `cargo test --no-run` produced for the same profile.
      - name: Build App test binaries
        run: cargo test -p hardware_visualizer --no-run

      - name: Run both runners alternately
        shell: bash
        run: |
          set -uo pipefail
          failed=0
          {
            echo "## App tests on ${{ matrix.platform }}"
            echo
            echo "| Round | Runner | Exit | Seconds |"
            echo "|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

          run_variant() {
            local round="$1" runner="$2"
            local log="${runner}-${round}.log"
            local start end status
            start=$(date +%s)
            if [ "$runner" = "cargo-test" ]; then
              cargo test -p hardware_visualizer -- --test-threads=1 --nocapture >"$log" 2>&1
            else
              cargo nextest run -p hardware_visualizer --profile ci >"$log" 2>&1
            fi
            status=$?
            end=$(date +%s)
            echo "| ${round} | ${runner} | ${status} | $((end - start)) |" >> "$GITHUB_STEP_SUMMARY"
            echo "::group::${runner} round ${round} (exit ${status}, $((end - start))s)"
            tail -n 60 "$log"
            echo "::endgroup::"
            if [ "$status" -ne 0 ]; then
              failed=1
            fi
          }

          run_variant 1 cargo-test
          run_variant 1 nextest
          run_variant 2 nextest
          run_variant 2 cargo-test

          exit "$failed"

      - name: Upload runner logs
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: runner-logs-${{ matrix.platform }}
          path: |
            *.log
            target/nextest/ci/junit.xml
          if-no-files-found: ignore
