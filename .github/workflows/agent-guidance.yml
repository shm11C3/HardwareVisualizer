name: Agent Guidance

on:
  pull_request:
    paths:
      - "**/AGENTS.md"
      - "CLAUDE.md"
      - ".agents/rules/**"
      - ".agents/skills/**"
      - ".agents/tooling/**"
      - ".claude/agents/**"
      - ".claude/settings.json"
      - ".codex/hooks.json"
      - ".github/pull_request_template.md"
      - ".github/PULL_REQUEST_TEMPLATE/**"
      - ".github/scripts/**"
      - ".github/workflows/agent-guidance.yml"
      - ".github/workflows/pr-branch-name.yml"
      - "CONTRIBUTING.md"
      - "docs/agents/**"
      - "docs/adr/**"
      - "docs/design-principles.md"
      - "docs/architecture/backend.md"
      - "docs/specs/sensors/README.md"
      - "docs/development/sensor-handoff/01-spec-gate.md"
      - "docs/development/sensor-handoff/07-phase3-nuvoton-spec.md"
      - "docs/development/sensor-handoff/08-phase4-ite-spec.md"
      - "hardviz/core/README.md"
      - "hardviz/app/README.md"
      - "src/README.md"
      - "docs/README.md"
      - "docs/documentation-guide.md"
      - "biome.jsonc"
      - "package.json"
  push:
    branches:
      - develop
    paths:
      - "**/AGENTS.md"
      - "CLAUDE.md"
      - ".agents/rules/**"
      - ".agents/skills/**"
      - ".agents/tooling/**"
      - ".claude/agents/**"
      - ".claude/settings.json"
      - ".codex/hooks.json"
      - ".github/pull_request_template.md"
      - ".github/PULL_REQUEST_TEMPLATE/**"
      - ".github/scripts/**"
      - ".github/workflows/agent-guidance.yml"
      - ".github/workflows/pr-branch-name.yml"
      - "CONTRIBUTING.md"
      - "docs/agents/**"
      - "docs/adr/**"
      - "docs/design-principles.md"
      - "docs/architecture/backend.md"
      - "docs/specs/sensors/README.md"
      - "docs/development/sensor-handoff/01-spec-gate.md"
      - "docs/development/sensor-handoff/07-phase3-nuvoton-spec.md"
      - "docs/development/sensor-handoff/08-phase4-ite-spec.md"
      - "hardviz/core/README.md"
      - "hardviz/app/README.md"
      - "src/README.md"
      - "docs/README.md"
      - "docs/documentation-guide.md"
      - "biome.jsonc"
      - "package.json"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-slim
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate agent guidance
        run: node .agents/tooling/check-agent-guidance.mjs

      - name: Test agent hooks
        run: node .agents/tooling/test-agent-hook.mjs

      - name: Test agent guidance failures
        run: node .agents/tooling/test-agent-guidance.mjs

      - name: Check script syntax
        run: |
          node --check .agents/tooling/agent-hook.mjs
          node --check .agents/tooling/guidance-paths.mjs
          node --check .agents/tooling/check-agent-guidance.mjs
          node --check .agents/tooling/test-agent-guidance.mjs
          node --check .agents/tooling/test-agent-hook.mjs

      - name: Check whitespace
        env:
          BASE_SHA: ${{ github.event.before }}
        run: |
          # On pull_request, GITHUB_SHA is the merge commit onto the current
          # base tip. pull_request.base.sha can lag behind that tip, which
          # would pull unrelated base-branch changes into the diff.
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            BASE_SHA="$(git rev-parse "$GITHUB_SHA^1")"
          elif [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            BASE_SHA="$(git rev-list --max-parents=0 HEAD | tail -1)"
          fi
          git diff --check "$BASE_SHA" "$GITHUB_SHA"
