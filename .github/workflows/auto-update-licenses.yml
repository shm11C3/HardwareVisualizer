name: "Auto Update Licenses Twice Monthly"

on:
  schedule:
    # Twice monthly on the 9th and 23rd at 12:00 JST (03:00 UTC)
    - cron: "0 3 9,23 * *"
  workflow_dispatch:

permissions: read-all

jobs:
  generate-licenses:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runs-on: windows-latest

          - platform: linux
            runs-on: ubuntu-22.04

          - platform: macos
            runs-on: macos-latest

    runs-on: ${{ matrix.runs-on }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: $/.github/actions/setup-node

      - name: Setup Rust
        uses: $/.github/actions/setup-rust
        with:
          components: ""
          cache-key: cargo-license
          cache-targets: "false"

      - name: Install dependencies
        run: npm ci

      - name: Install cargo-license
        run: cargo install cargo-license

      - name: Generate licenses
        run: node --experimental-strip-types .github/scripts/generate-licenses.ts ${{ matrix.platform }} duckdb-archive

      - name: Upload license artifacts
        uses: actions/upload-artifact@v7.0.2
        with:
          name: licenses-${{ matrix.platform }}
          path: ./docs/licenses/${{ matrix.platform }}/
          retention-days: 7

  merge-and-create-pr:
    needs: generate-licenses
    runs-on: ubuntu-latest

    steps:
      - uses: actions/create-github-app-token@v3.3.0
        id: generate-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Download Windows licenses
        uses: actions/download-artifact@v8.0.2
        with:
          name: licenses-windows
          path: ./docs/licenses/windows/

      - name: Download Linux licenses
        uses: actions/download-artifact@v8.0.2
        with:
          name: licenses-linux
          path: ./docs/licenses/linux/

      - name: Download macOS licenses
        uses: actions/download-artifact@v8.0.2
        with:
          name: licenses-macos
          path: ./docs/licenses/macos/

      - name: Create PR if changed
        uses: peter-evans/create-pull-request@v8.1.1
        with:
          commit-message: "chore: update THIRD_PARTY_NOTICES.md (auto)"
          title: "chore: update THIRD_PARTY_NOTICES.md (auto)"
          body: |
            This PR updates the `THIRD_PARTY_NOTICES.md` file with the latest licenses.
            It is automatically generated by the workflow ( `.github/workflows/auto-update-licenses.yml` ).

            Generated from multiple platforms to ensure comprehensive license coverage.
          branch: chore/auto-update-licenses-${{ github.run_id }}
          add-paths: |
            ./docs/licenses
          token: ${{ steps.generate-token.outputs.token }}
          delete-branch: true
          labels: |
            change:docs
            area:docs
            source:automation
