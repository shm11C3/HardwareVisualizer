name: "Auto Update Licenses Weekly"

on:
  schedule:
    - cron: "0 3 * * 5"
  workflow_dispatch:

permissions: read-all

jobs:
  generate-licenses:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runs-on: windows-latest

          - platform: linux
            runs-on: ubuntu-22.04

    runs-on: ${{ matrix.runs-on }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup Node.js
        uses: ./.github/actions/setup-node

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          components: ""

      - name: Install dependencies
        run: npm ci

      - name: Install cargo-license
        run: cargo install cargo-license

      - name: Generate licenses
        run: node --experimental-strip-types .github/scripts/generate-licenses.ts ${{ matrix.platform }}

      - name: Upload license artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: licenses-${{ matrix.platform }}
          path: ./docs/third-party-notices/${{ matrix.platform }}/
          retention-days: 7

  merge-and-create-pr:
    needs: generate-licenses
    runs-on: ubuntu-latest

    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: generate-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Download Windows licenses
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: licenses-windows
          path: ./docs/third-party-notices/windows/

      - name: Download Linux licenses
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: licenses-linux
          path: ./docs/third-party-notices/linux/

      - name: Create PR if changed
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          commit-message: "chore: update THIRD_PARTY_NOTICES.md (auto)"
          title: "chore: update THIRD_PARTY_NOTICES.md (auto)"
          body: |
            This PR updates the `THIRD_PARTY_NOTICES.md` file with the latest licenses.
            It is automatically generated by the workflow ( `.github/workflows/auto-update-licenses.yml` ).

            Generated from multiple platforms to ensure comprehensive license coverage.
          branch: chore/auto-update-licenses-${{ github.run_id }}
          add-paths: |
            ./docs/third-party-notices
          token: ${{ steps.generate-token.outputs.token }}
          delete-branch: true
