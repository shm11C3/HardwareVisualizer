name: "Cache health"

on:
  schedule:
    - cron: "17 2 * * 0"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  actions-cache-inventory:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Collect Actions cache inventory
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require("node:fs");
            const path = require("node:path");
            const {
              buildCacheInventory,
              renderCacheInventorySummary,
            } = require(path.join(
              process.env.GITHUB_WORKSPACE,
              ".github/scripts/cache-inventory.cjs",
            ));

            const caches = [];
            for (let page = 1; ; page += 1) {
              const response = await github.request(
                "GET /repos/{owner}/{repo}/actions/caches",
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  per_page: 100,
                  page,
                },
              );
              caches.push(...response.data.actions_caches);
              if (response.data.actions_caches.length < 100) break;
            }

            const inventory = buildCacheInventory(caches, new Date().toISOString());
            fs.writeFileSync(
              path.join(process.env.RUNNER_TEMP, "actions-cache-inventory.json"),
              JSON.stringify(inventory, null, 2),
            );
            await core.summary.addRaw(renderCacheInventorySummary(inventory)).write();

      - name: Upload cache inventory
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: actions-cache-inventory
          path: ${{ runner.temp }}/actions-cache-inventory.json
          retention-days: 30
