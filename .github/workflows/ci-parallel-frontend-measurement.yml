name: CI parallel frontend measurement

# Temporary, PR-scoped evidence for adopting the rustc parallel frontend, which
# nightly enables by default from nightly-2026-11-14 (two frontend threads).
#
# Hosted runners of one label differ by up to several times in build speed, so
# every variant is compiled on the same runner and compared within the job.
# Each variant gets its own target directory; `touch` rebuilds are interleaved
# across variants, and the two samples run the variants in opposite order.
# `--no-default-features` leaves out the bundled DuckDB C++ build, which the
# frontend does not affect and which CI serves from sccache.
on:
  pull_request:
    branches:
      - develop
    paths:
      - .github/workflows/ci-parallel-frontend-measurement.yml

permissions:
  contents: read

env:
  NIGHTLY: nightly-2026-11-16
  CARGO_TERM_COLOR: never
  TOUCH_REPEATS: "3"

jobs:
  measure:
    name: sample ${{ matrix.sample }} (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        platform: ["windows-latest", "ubuntu-22.04", "macos-latest"]
        sample: [1, 2]
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # Eight profile builds across four target directories do not fit in the
      # default free space.
      - name: Free Linux disk space
        if: runner.os == 'Linux'
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup

      - name: Setup Linux dependencies
        if: runner.os == 'Linux'
        uses: $/.github/actions/setup-linux-deps

      - name: Setup pinned stable Rust
        id: stable
        uses: $/.github/actions/setup-rust-toolchain
        with:
          components: clippy

      - name: Setup nightly Rust
        shell: bash
        run: |
          rustup toolchain install "$NIGHTLY" --profile minimal --component clippy --no-self-update
          rustc "+$NIGHTLY" --version
          nproc 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null || echo "$NUMBER_OF_PROCESSORS"

      - name: Prepare frontendDist placeholder
        shell: bash
        run: |
          mkdir -p dist
          printf '<!doctype html><html><body></body></html>\n' > dist/index.html

      - name: Measure builds
        shell: bash
        env:
          STABLE: ${{ steps.stable.outputs.toolchain }}
          SAMPLE: ${{ matrix.sample }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -uo pipefail
          # RUSTFLAGS replaces target.<triple>.rustflags from .cargo/config.toml,
          # so the Windows crt-static flag is repeated here.
          base_flags=""
          if [ "$RUNNER_OS" = "Windows" ]; then
            base_flags="-C target-feature=+crt-static"
          fi
          # name|toolchain|frontend flags
          variants=(
            "stable|$STABLE|"
            "nightly-j1|$NIGHTLY|-Zunstable-options --jobs-frontend=1"
            "nightly-default|$NIGHTLY|"
            "nightly-j4|$NIGHTLY|-Zunstable-options --jobs-frontend=4"
          )
          if [ "$SAMPLE" = "2" ]; then
            reversed=()
            for (( i=${#variants[@]}-1; i>=0; i-- )); do reversed+=("${variants[$i]}"); done
            variants=("${reversed[@]}")
          fi

          results=results.tsv
          printf 'platform\tsample\tvariant\tworkload\tseconds\tstatus\n' > "$results"
          failed=0
          measure() { # variant-row workload cargo-args...
            local row="$1" workload="$2"; shift 2
            local name toolchain flags
            IFS='|' read -r name toolchain flags <<< "$row"
            local started=$SECONDS status=0
            RUSTUP_TOOLCHAIN="$toolchain" RUSTFLAGS="$base_flags $flags" \
              CARGO_TARGET_DIR="t/$name" CARGO_BUILD_BUILD_DIR="{workspace-root}/t/$name" \
              cargo "$@" --no-default-features || status=$?
            local elapsed=$(( SECONDS - started ))
            printf '%s\t%s\t%s\t%s\t%s\t%s\n' "$PLATFORM" "$SAMPLE" "$name" "$workload" "$elapsed" "$status" >> "$results"
            echo "::notice title=$name $workload::${elapsed}s status=$status"
            if (( status != 0 )); then failed=1; fi
          }

          # The two builds of the test-build job: pull requests build the ci
          # profile, pushes build release through tauri-action. Clippy and
          # `cargo test --no-run` were measured by the previous revision.
          # name|cargo arguments
          workloads=(
            "ci-build|build -p hardware_visualizer --profile ci --features custom-protocol"
            "release-build|build -p hardware_visualizer --release --features custom-protocol"
          )
          for row in "${variants[@]}"; do
            for wl in "${workloads[@]}"; do
              IFS='|' read -r wl_name wl_args <<< "$wl"
              # shellcheck disable=SC2086 # wl_args is a list of plain words
              measure "$row" "$wl_name-cold" $wl_args
            done
          done
          for _ in $(seq "$TOUCH_REPEATS"); do
            for row in "${variants[@]}"; do
              for wl in "${workloads[@]}"; do
                IFS='|' read -r wl_name wl_args <<< "$wl"
                touch core/src/lib.rs
                # shellcheck disable=SC2086 # wl_args is a list of plain words
                measure "$row" "$wl_name-touch" $wl_args
              done
            done
          done

          {
            echo "### sample $SAMPLE ($PLATFORM)"
            echo
            echo '| Variant | Workload | Seconds | Status |'
            echo '| --- | --- | ---: | ---: |'
            tail -n +2 "$results" | awk -F'\t' '{printf "| %s | %s | %s | %s |\n", $3, $4, $5, $6}'
          } >> "$GITHUB_STEP_SUMMARY"
          df -h . || true
          exit "$failed"

      - name: Upload measurements
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: parallel-frontend-sample${{ matrix.sample }}-${{ matrix.platform }}
          path: results.tsv
          retention-days: 14
