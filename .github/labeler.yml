"area:frontend":
  - changed-files:
      - any-glob-to-any-file:
          - "src/**"
          - "index.html"
          - "package.json"
          - "package-lock.json"
          - "vite.config.*"
          - "vitest.config.*"
          - "playwright*.config.*"
          - "tsconfig*.json"

"area:core":
  - changed-files:
      - any-glob-to-any-file:
          - "core/**"

"area:tauri":
  - changed-files:
      - any-glob-to-any-file:
          - "src-tauri/**"

"area:github-actions":
  - changed-files:
      - any-glob-to-any-file:
          - ".github/workflows/**"
          - ".github/actions/**"
          - ".github/scripts/**"

"area:docs":
  - changed-files:
      - any-glob-to-any-file:
          - "**/*.md"
          - "docs/**"

"area:rust":
  - changed-files:
      - any-glob-to-any-file:
          - "Cargo.toml"
          - "**/Cargo.toml"
          - "Cargo.lock"
          - "rust-toolchain.toml"
          - ".cargo/**"
          - "core/**"
          - "src-tauri/**"

"area:javascript":
  - changed-files:
      - any-glob-to-any-file:
          - "package.json"
          - "package-lock.json"
          - "src/**"
          - "vite.config.*"
          - "vitest.config.*"
          - "playwright*.config.*"
          - "tsconfig*.json"

"area:config":
  - changed-files:
      - any-glob-to-any-file:
          - "tsconfig*.json"
          - "vite.config.*"
          - "vitest.config.*"
          - "playwright*.config.*"
          - "Cargo.toml"
          - "**/Cargo.toml"
          - "*.conf.json"
          - "src-tauri/*.conf.json"
          - ".cargo/**"

"change:deps":
  - changed-files:
      - any-glob-to-any-file:
          - "Cargo.lock"
          - "package-lock.json"
          - "package.json"
          - "Cargo.toml"
          - "**/Cargo.toml"
          - "rust-toolchain.toml"

"change:config":
  - changed-files:
      - any-glob-to-any-file:
          - "tsconfig*.json"
          - "vite.config.*"
          - "vitest.config.*"
          - "playwright*.config.*"
          - "Cargo.toml"
          - "**/Cargo.toml"
          - "*.conf.json"

"change:feature":
  - head-branch: ["^feat/.*", "^feature/.*"]

"change:fix":
  - head-branch: ["^fix/.*"]

"change:docs":
  - head-branch: ["^docs/.*"]
  - changed-files:
      - any-glob-to-any-file:
          - "**/*.md"
          - "docs/**"

"change:refactor":
  - head-branch: ["^refactor/.*"]

"change:ci":
  - changed-files:
      - any-glob-to-any-file:
          - ".github/workflows/**"
          - ".github/actions/**"
          - ".github/scripts/**"

"change:test":
  - changed-files:
      - any-glob-to-any-file:
          - "**/*.test.*"
          - "src/setupVitest.ts"
          - "src/e2e/**"
          - "e2e/**"
          - "e2e-native/**"
          - "playwright*.config.*"
          - "vitest.config.*"
