# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
      time: "08:30"
      timezone: "Asia/Tokyo"
    cooldown:
      default-days: 5
    open-pull-requests-limit: 40
    labels:
      - "change:deps"
      - "area:javascript"
      - "area:frontend"

    ignore:
      - dependency-name: "@tauri-apps/*"

    groups:
      default:
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"
        exclude-patterns:
          - "react*"
          - "@types/react*"
          - "typescript"
          - "@tauri-apps/*"
      react:
        patterns:
          - "react"
          - "react-dom"
      biome:
        patterns:
          - "@biomejs/biome"

  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:30"
      timezone: "Asia/Tokyo"
    cooldown:
      default-days: 5
    open-pull-requests-limit: 40
    labels:
      - "change:deps"
      - "area:rust"
    ignore:
      - dependency-name: "tauri"
      - dependency-name: "tauri-build"
      - dependency-name: "tauri-plugin-*"
      - dependency-name: "tauri-specta"

  - package-ecosystem: "rust-toolchain"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:30"
      timezone: "Asia/Tokyo"
    cooldown:
      default-days: 5
    labels:
      - "change:deps"
      - "area:rust"

  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Asia/Tokyo"
    cooldown:
      default-days: 5
    labels:
      - "change:deps"
      - "area:github-actions"
