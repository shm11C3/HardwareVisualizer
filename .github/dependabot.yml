# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "08:30"
      timezone: "Asia/Tokyo"
    cooldown:
      default-days: 5
    open-pull-requests-limit: 40
    labels:
      - "change:deps"
      - "area:javascript"
      - "area:frontend"

    ignore:
      - dependency-name: "@tauri-apps/*"

    groups:
      default:
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"
        exclude-patterns:
          - "react*"
          - "@types/react*"
          - "typescript"
          - "@tauri-apps/*"
          - "vitest"
          - "@vitest/*"
      react:
        patterns:
          - "react"
          - "react-dom"
      biome:
        patterns:
          - "@biomejs/biome"
      # vitest and @vitest/* plugins must share the same version; group all
      # update types (including major) so they land in a single PR.
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"

  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:30"
      timezone: "Asia/Tokyo"
    cooldown:
      default-days: 5
    open-pull-requests-limit: 40
    labels:
      - "change:deps"
      - "area:core"
      - "area:tauri"
    ignore:
      - dependency-name: "tauri"
      - dependency-name: "tauri-build"
      - dependency-name: "tauri-plugin-*"
      - dependency-name: "tauri-specta"
      # Keep aligned with Tauri's dependency; a second semver-incompatible copy duplicates macOS Objective-C symbols under release LTO.
      - dependency-name: "window-vibrancy"

  - package-ecosystem: "rust-toolchain"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:30"
      timezone: "Asia/Tokyo"
    cooldown:
      default-days: 5
    labels:
      - "change:deps"
      - "area:core"
      - "area:tauri"

  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Asia/Tokyo"
    cooldown:
      default-days: 5
    labels:
      - "change:deps"
      - "area:github-actions"

    groups:
      # init / analyze / upload-sarif must run the same version; updating them
      # separately fails with "Loaded a configuration file for version X, but
      # running version Y".
      codeql-action:
        patterns:
          - "github/codeql-action*"
