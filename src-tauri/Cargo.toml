[package]
name = "hardware_visualizer"
version = "1.0.0"
description = "A real-time hardware monitoring tool for Windows"
authors = ["@shm11C3"]
license = "GPL-3.0-or-later"
repository = ""
edition = "2024"
default-run = "hardware_visualizer"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
quote = "1.0.45"
syn = { version = "3.0.2", features = ["full"] }
tauri-build = { version = "2.7.1", features = [] }


[dependencies]
hardviz-core = { path = "../core", default-features = false }
serde_json = "1.0.150"
serde = { version = "1.0.228", features = ["derive"] }
tauri = { version = "2.12.1", features = ["macos-private-api", "tray-icon"] }
sysinfo = "0.39.3"
tauri-plugin-window-state = { version = "2.5.0" }
tokio = { version = "1.52.3", features = [
    "rt-multi-thread",
    "macros",
    "time",
    "fs",
] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = [
    "env-filter",
    "fmt",
] }
chrono = "0.4.44"
tauri-plugin-dialog = "2.8.1"
tauri-plugin-store = "2.5.0"
base64 = "0.23"
image = { version = "0.25.10", default-features = false, features = ["png"] }
regex = "1.12.3"
tempfile = "3.27.0"
sys-locale = "0.3.2"
tauri-specta = { version = "=2.0.0-rc.24", features = ["derive", "typescript"] }
specta-typescript = "0.0.11"
specta = "=2.0.0-rc.24"
tauri-plugin-shell = "2.4.1"
sqlx = { version = "0.8.6", features = [
    "sqlite",
    "runtime-tokio-rustls",
    "macros",
    "chrono",
] }
async-trait = "0.1"
tauri-plugin-os = "2.4.0"
tauri-plugin-clipboard-manager = "2.4.1"
tauri-plugin-opener = "2.7.0"
tauri-plugin-single-instance = "2.5.2"

[dependencies.uuid]
version = "1.23.2"
features = [
    "v7",                # Lets you generate random UUIDs
    "fast-rng",          # Use a faster (but still sufficiently random) RNG
    "macro-diagnostics", # Enable better diagnostics for compile-time UUIDs
]

[features]
default = ["duckdb-archive"]
# this feature is used for production builds or when `devPath` points to the filesystem and the built-in dev server is disabled.
# If you use cargo directly instead of tauri's cli you can use this feature flag to switch between tauri's `dev` and `build` modes.
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]
bindings-export = []
duckdb-archive = ["hardviz-core/duckdb-archive"]

[[bin]]
name = "export_bindings"
path = "src/bin/export_bindings.rs"
required-features = ["bindings-export"]

[target.'cfg(windows)'.dependencies]
wmi = "0.18.4"
dxgi = "0.1.7"
webview2-com = "0.39.1"
# Keep this aligned with webview2-com; its COM interfaces implement this
# windows-core version's Interface trait. A mismatch fails to compile with
# "no method named `cast`".
windows-core = "0.100"
winapi = { version = "0.3", features = ["dxgi", "setupapi", "devguid"] }
windows = { version = "0.62.2", features = [
    "Data_Xml_Dom",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_DataExchange",
    "Win32_System_Performance",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
nvapi = "=0.1.4"
libloading = "0.9"

[target.'cfg(target_os = "linux")'.dependencies]
ipnet = "2.12.0"
dirs = "7.0.0"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
core-foundation = "0.10.1"
objc2 = "0.6.4"
# Keep this on the same semver line as the window-vibrancy Tauri depends on so
# the tree holds a single copy (`cargo tree -i window-vibrancy --target all`).
# Two semver-incompatible copies each compile the same
# `NSVisualEffectViewTagged` Objective-C class, and the release profile's LTO
# (`lto = true`, `codegen-units = 1`) then fails the macOS link with
# "symbol multiply defined" for `__CLASS_NSVisualEffectViewTagged` (see #1724/#1718).
window-vibrancy = "0.8"
objc2-app-kit = { version = "0.3.2", features = [
    "NSAttributedString",
    "NSButton",
    "NSColor",
    "NSControl",
    "NSEvent",
    "NSFont",
    "NSImage",
    "NSMenu",
    "NSMenuItem",
    "NSStatusBar",
    "NSStatusBarButton",
    "NSStatusItem",
    "NSTextAttachment",
    "NSView",
    "objc2-core-foundation",
] }
objc2-foundation = { version = "0.3.2", features = [
    "NSAttributedString",
    "NSData",
    "NSDictionary",
    "NSGeometry",
    "NSObject",
    "NSRange",
    "NSString",
] }

[lib]
name = "hardware_monitor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dev-dependencies]
tauri = { version = "2.12.1", features = ["test"] }
mockall = "0.15"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2.7.0"
tauri-plugin-updater = "2.13.2"
