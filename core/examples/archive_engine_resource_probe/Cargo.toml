[package]
name = "archive-engine-resource-probe"
version = "0.1.0"
edition = "2024"
publish = false
license = "GPL-3.0-or-later"

[features]
default = []
sqlite-control = ["dep:sqlx"]
duckdb-engine = ["dep:duckdb"]

[dependencies]
serde_json = "=1.0.150"
tokio = { version = "=1.52.3", features = ["rt-multi-thread", "macros"] }
duckdb = { version = "=1.10505.0", default-features = false, features = ["bundled"], optional = true }
sqlx = { version = "=0.8.6", features = ["sqlite", "runtime-tokio-rustls", "macros", "chrono", "migrate"], optional = true }

[[bin]]
name = "resource-probe-baseline"
path = "src/bin/baseline.rs"

[[bin]]
name = "resource-probe-sqlite"
path = "src/bin/sqlite.rs"
required-features = ["sqlite-control"]

[[bin]]
name = "resource-probe-duckdb"
path = "src/bin/duckdb.rs"
required-features = ["duckdb-engine"]

[profile.release]
opt-level = "s"
debug = false
overflow-checks = true
lto = true
strip = true
codegen-units = 1

[workspace]
