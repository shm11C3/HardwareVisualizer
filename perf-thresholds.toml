[thresholds]
max_avg_cpu_percent = 5.0
max_p95_cpu_percent = 10.0
max_avg_app_memory_mb = 100.0
max_p95_app_memory_mb = 100.0
max_app_memory_growth_mb = 50.0
max_avg_memory_mb = 450.0
max_p95_memory_mb = 500.0
max_memory_growth_mb = 50.0

[timing]
# Wait at least 15s, then allow up to 45s for a stable helper set and RSS
# baseline before the measurement window starts.
warmup_seconds = 15
stabilization_timeout_seconds = 45
measurement_seconds = 60
sample_interval_ms = 1000

[platforms.windows]
# Native DuckDB activation measures about 100 MiB average and 102-103 MiB P95
# on hosted Windows runners (observed 2026-09). Keep roughly 10% headroom for
# normal runner variance while preserving the independent growth limit.
max_avg_app_memory_mb = 110.0
max_p95_app_memory_mb = 120.0
max_avg_memory_mb = 600.0
max_p95_memory_mb = 600.0

[platforms.linux]
max_avg_app_memory_mb = 150.0
max_p95_app_memory_mb = 150.0
max_avg_memory_mb = 550.0
max_p95_memory_mb = 550.0

[platforms.macos]
max_avg_app_memory_mb = 150.0
max_p95_app_memory_mb = 150.0
max_avg_memory_mb = 600.0
max_p95_memory_mb = 650.0
