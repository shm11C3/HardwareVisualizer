id = "RUSTSEC-2026-0367"
ignoreUntil = 2027-01-18
reason = "zip SUID/SGID bits preserved during extraction - zip 4.6.1 is pulled only by tauri-plugin-updater (2.x still requires zip ^4), which calls ZipArchive::extract on Windows only and only after the update signature is verified against the bundled public key. Re-evaluate when the updater moves to zip >= 9."

