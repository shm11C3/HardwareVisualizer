[workspace]
resolver = "3"
members = ["hardviz/core", "hardviz/app", "hardviz/sensor-service"]
exclude = ["perf-monitor"]

[workspace.lints.cargo]
unused_dependencies = "deny"

[profile.dev]
opt-level = 0
# Line tables are enough for panics, backtraces and test failures. Full
# debuginfo for the whole workspace made each shared build subtree 40 GiB and
# more (see docs/development/local-build-cache.md). For a session that steps
# through workspace code in a debugger, run with CARGO_PROFILE_DEV_DEBUG=true.
debug = "line-tables-only"
overflow-checks = true
lto = false

# The bundled DuckDB C++ library carried 2.3 GiB of debuginfo per subtree, and
# nothing in this repository debugs into it.
[profile.dev.package.libduckdb-sys]
debug = false

[profile.release]
opt-level = "s"
debug = false
overflow-checks = true
lto = true
strip = true
codegen-units = 1

[profile.ci]
inherits = "release"
opt-level = 0
lto = false
codegen-units = 256

# Keeps the bundled DuckDB C++ library at the `release` profile's opt-level so
# the performance test measures the engine as shipped. Keep this equal to
# `[profile.release]`'s `opt-level`. Windows measurement on 2026-11-20 (app
# process average working set): 110.4 MB with the engine at opt-level 0 versus
# 97.2 MB at "s".
[profile.ci.package.libduckdb-sys]
opt-level = "s"
