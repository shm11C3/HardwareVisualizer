[workspace]
resolver = "3"
members = ["core", "src-tauri"]
exclude = ["perf-monitor"]

[profile.dev]
opt-level = 0
debug = true
overflow-checks = true
lto = false

[profile.release]
opt-level = "s"
debug = false
overflow-checks = true
lto = true
strip = true
codegen-units = 1

[profile.ci]
inherits = "release"
opt-level = 0
lto = false
codegen-units = 256
