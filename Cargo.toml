[workspace]
resolver = "3"
members = ["core", "src-tauri"]
exclude = ["perf-monitor"]

[profile.dev]
opt-level = 0
# Line tables are enough for panics, backtraces and test failures. Full
# debuginfo for the whole workspace made each shared build subtree 40 GiB and
# more (see docs/development/local-build-cache.md). For a session that steps
# through workspace code in a debugger, run with CARGO_PROFILE_DEV_DEBUG=true.
debug = "line-tables-only"
overflow-checks = true
lto = false

# The bundled DuckDB C++ library carried 2.3 GiB of debuginfo per subtree, and
# nothing in this repository debugs into it.
[profile.dev.package.libduckdb-sys]
debug = false

[profile.release]
opt-level = "s"
debug = false
overflow-checks = true
lto = true
strip = true
codegen-units = 1

[profile.ci]
inherits = "release"
opt-level = 0
lto = false
codegen-units = 256
